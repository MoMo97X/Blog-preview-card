<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog preview card</title>
    <meta
      name="description"
      content="Front-End mentor challenge card component"
    />
    <!-- Open Graph Meta Tags -->
    <meta
      property="og:description"
      content="Front End Mentor challenge 'Blog preview card'."
    />
    <meta property="og:title" content="Blog Preview Card" />
    <meta property="og:image" content="/design/desktop-design.jpg" />

    <style>
      @font-face {
        font-family: figtree-italic;
        src: url(fonts/Figtree-Italic-VariableFont_wght.ttf);
        font-style: italic;
        font-weight: 900;
        font-display: swap;
      }

      @font-face {
        font-family: figtree;
        src: url(fonts/Figtree-VariableFont_wght.ttf);
        font-display: swap;
        font-weight: 500;
      }

      :root {
        --primary-yellow: #f4d04e;
        --neutral-white: #fff;
        --neutral-black: #000;
        --neutral-gray: #6b6b6b;
      }

      body {
        margin: 0;
        background-color: var(--primary-yellow);
        font-family: figtree;
        min-height: 100vh;
        display: grid;
        place-content: center;
      }

      h1,
      p {
        margin: 0;
      }

      .card {
        width: 300px;
        padding: 24px;
        background-color: var(--neutral-white);
        border-radius: 20px;
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 24px;
        box-shadow: 10px 10px 0 0 var(--neutral-black);
      }

      .card .blog-img {
        max-width: 100%;
        display: block;
        border-radius: 10px;
      }

      .card .content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        font-size: 12px;
      }

      .card .category {
        background-color: var(--primary-yellow);
        padding: 4px 12px;
        border-radius: 4px;
        font-weight: bold;
      }

      .card .title {
        font-size: 20px;
        font-family: figtree-italic;
        cursor: pointer;
        transition: 0.3s;
      }

      .card .title:hover {
        color: var(--primary-yellow);
      }

      .card .description {
        color: var(--neutral-gray);
        font-size: 14px;
      }

      .author {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .author img {
        display: block;
        width: 32px;
      }

      .author .author-name {
        color: #111111;
        font-weight: bold;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card">
        <img
          aria-hidden="true"
          src="images/illustration-article.svg"
          alt=""
          class="blog-img"
        />
        <div class="content">
          <span class="category">Loading</span>
          <time datetime="2026-09-24">Published 24 Sep 2026</time>
          <h1 class="title">HTML & CSS foundations</h1>
          <p class="description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <div class="author">
          <img src="images/image-avatar.webp" alt="Greg Hooper" />
          <span class="author-name">Greg Hooper</span>
        </div>
      </article>
    </main>
  </body>
</html>
