<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog preview card</title>
    <meta
      name="description"
      content="Front-End mentor challenge card component"
    />
    <!-- Open Graph Meta Tags -->
    <meta
      property="og:description"
      content="Front End Mentor challenge 'Blog preview card'."
    />
    <meta property="og:title" content="Blog Preview Card" />
    <meta property="og:image" content="/design/desktop-design.jpg" />

    <style>
      @font-face {
        font-family: figtree-italic;
        src: url(fonts/Figtree-Italic-VariableFont_wght.ttf);
        font-style: italic;
        font-weight: 900;
        font-display: swap;
      }

      @font-face {
        font-family: figtree;
        src: url(fonts/Figtree-VariableFont_wght.ttf);
        font-display: swap;
        font-weight: 500;
      }

      :root {
        --primary-yellow: #f4d04e;
        --neutral-white: #fff;
        --neutral-black: #000;
        --neutral-gray: #6b6b6b;
        --title-color: #111111;
      }

      body {
        margin: 0;
        background-color: var(--primary-yellow);
        font-family: figtree, Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: grid;
        place-content: center;
      }

      h1,
      p {
        margin: 0;
      }

      .card {
        width: min(18.75rem, 90vw);
        padding: min(1.5rem, 5vw);
        background-color: var(--neutral-white);
        border-radius: min(1.25rem, 5vw);
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: min(1.5rem, 5vw);
        box-shadow: 0.625rem 0.625rem 0 var(--neutral-black);
      }

      .card .blog-img {
        max-width: 100%;
        display: block;
        border-radius: min(0.625rem, 3vw);
      }

      .card .content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: min(0.75rem, 3vw);
        font-size: 0.75rem;
      }

      .card .category {
        background-color: var(--primary-yellow);
        padding: min(0.25rem, 1vw) min(0.75rem, 3vw);
        border-radius: min(0.25rem, 1vw);
        font-weight: bold;
      }

      .card .title {
        color: var(--title-color);
        text-decoration: none;
        transition: 0.5s;
        font-size: min(1.25rem, 5vw);
        font-family:
          figtree-italic,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      .card .title:hover {
        color: var(--primary-yellow);
      }

      .card .description {
        color: var(--neutral-gray);
        font-size: 0.875rem;
      }

      .author {
        display: flex;
        align-items: center;
        gap: min(0.625rem, 2vw);
      }

      .author img {
        display: block;
        width: 2rem;
      }

      .author .author-name {
        color: var(--title-color);
        font-weight: bold;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card">
        <img
          aria-hidden="true"
          src="images/illustration-article.svg"
          alt=""
          class="blog-img"
        />
        <div class="content">
          <span class="category">Loading</span>
          <time datetime="2026-09-24">Published 24 Sep 2026</time>
          <a href="#" class="title">HTML & CSS foundations</a>
          <p class="description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <div class="author">
          <img src="images/image-avatar.webp" alt="Greg Hooper" />
          <span class="author-name">Greg Hooper</span>
        </div>
      </article>
    </main>
  </body>
</html>
